<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Space Shooter Game</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  </head>
  <body>
    <div class="space-background">
        <div class="stars"></div>
        <div class="stars"></div>
        <div class="stars"></div>
        <div class="stars"></div>
        <div class="stars"></div>
    </div>
    <div class="controls-top">
      <h1>Space Shooter</h1>
      <button id="desktopStartBtn" class="icon-button"><i class="fas fa-play"></i></button>
      <button id="pauseBtn" class="icon-button" style="display: none"><i class="fas fa-pause"></i></button>
    </div>
    <div id="gameContainer">
      <canvas id="gameCanvas"></canvas>
    </div>
    <div class="game-controls-container">
      <button id="leftBtn" class="control-btn"><i class="fas fa-arrow-left"></i></button>
      <button id="upBtn" class="control-btn"><i class="fas fa-arrow-up"></i></button>
      <button id="downBtn" class="control-btn"><i class="fas fa-arrow-down"></i></button>
      <button id="rightBtn" class="control-btn"><i class="fas fa-arrow-right"></i></button>
      <button id="mobileStartBtn" class="control-btn start-btn"><i class="fas fa-play"></i></button>
      <button id="mobilePauseBtn" class="control-btn" style="display: none"><i class="fas fa-pause"></i></button>
    </div>
    <div class="pause-menu" id="pauseMenu">
      <h2>Game Paused</h2>
      <div class="audio-controls">
        <div class="audio-control">
          <i class="fas fa-volume-up"></i>
          <input type="range" id="soundVolume" min="0" max="1" step="0.1" value="0.5">
        </div>
        <div class="audio-control">
          <i class="fas fa-music"></i>
          <input type="range" id="musicVolume" min="0" max="1" step="0.1" value="0.3">
        </div>
      </div>
      <button id="resumeButton">Resume Game</button>
    </div>
    <audio id="playerShoot" src="../assets/audio/laser.mp3" preload="auto"></audio>
    <audio id="bossShoot" src="../assets/audio/bosslaser.mp3" preload="auto"></audio>
    <audio id="bgMusic" src="../assets/audio/shooter-background.mp3" preload="auto" loop></audio>
    <script src="script.js"></script>
  </body>
</html>
